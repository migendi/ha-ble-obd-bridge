name: "EMMA Veepeak OBD"
version: "0.1.3"
slug: "emma_veepeak_obd"
description: "Read-only BLE OBD reader for EMMA Veepeak OBDCheck BLE, publishes via MQTT"
arch:
  - aarch64
startup: application
boot: auto
init: false
host_dbus: true
host_network: true
uart: false
options:
  ble_address: ""
  ble_profile: auto
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_prefix: "emma/obd"
  poll_seconds: 5
schema:
  ble_address: str
  ble_profile: list(auto|fff0|ffe0|nordic_uart)
  mqtt_host: str
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_prefix: str
  poll_seconds: int(2,60)

services:
  - mqtt:need
hassio_api: true
hassio_role: default

map:
  - share:rw
